<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="./index.css" />
     <script src="./index.js" defer></script>
  </head>
  <body>
    <main id="container"></main>

    

    <!-- usar o adicionar en un template no genera reflow , no se renderiza en el DOM -->
    <!--es un fragmento de otro documento permite generar el reflow -->
    <template id="card-template">
        <article class="card">
        <h3 class="card__title"></h3>
        <div class="card__body">
          <div class='card__body__image'></div>
          <section class='card__body__content'>
          </section>
        </div>
      </article>
    </template>

  </body>
 
</html>
